# Release: on a version tag, check that the tag, package.json, install.sh, compose default image
# tag, CHANGELOG section and the packages agree, run the whole CI set on the tagged commit, then
# build and push the container image to GHCR for amd64 and arm64 with build provenance and an SBOM,
# create a GitHub Release with notes from CHANGELOG.md and the install.sh asset (the URL the
# README one-liner downloads), and publish the npm packages with provenance.
#
# - Runs only in Dash-AI-Tools/doc-my-repos: a fork that pushes a tag publishes nothing.
# - No long-lived credential: the image job uses the workflow's GITHUB_TOKEN (`packages: write`),
#   the github-release job uses it for `contents: write`, the packages job npm trusted publishing
#   (`id-token: write`, an OIDC token npm exchanges for a one-time publish token; each package's
#   trusted publisher is registered on npmjs.com).
# - A version that is already published is never overwritten: each job fails first.
# - The `release` environment can require a reviewer before the publish jobs run (repository
#   settings > Environments). Actions are pinned to commit SHAs (the comment names the release).
# - Pull requests exercise the same version check and a build-only (no push) image job via ci.yml.
name: Release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/dash-ai-tools/doc-my-repos

jobs:
  versions:
    name: Check versions
    if: github.repository == 'Dash-AI-Tools/doc-my-repos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag, package.json, install.sh, compose and CHANGELOG carry one version
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/check-release-versions.sh "$TAG"

  ci:
    name: CI
    needs: versions
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish the image
    needs: [versions, ci]
    if: github.repository == 'Dash-AI-Tools/doc-my-repos'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Refuse to overwrite a published version
        env:
          REFERENCE: ${{ env.IMAGE }}:${{ steps.version.outputs.number }}
        run: |
          if docker buildx imagetools inspect "$REFERENCE" >/dev/null 2>&1; then
            echo "::error::$REFERENCE is already published; versions are never overwritten."
            exit 1
          fi
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.number }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.number }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    # After the image is on GHCR so the README one-liner can pull it as soon as the Release exists.
    name: Create the GitHub Release
    needs: [versions, ci, image]
    if: github.repository == 'Dash-AI-Tools/doc-my-repos'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: scripts/release-notes.sh "$VERSION" --output release-notes.md
      - name: Create the Release with install.sh
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ steps.version.outputs.number }}
          body_path: release-notes.md
          files: install.sh
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

  packages:
    name: Publish the packages
    needs: [versions, ci]
    if: github.repository == 'Dash-AI-Tools/doc-my-repos'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Refuse to overwrite a published version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for name in core server ui; do
            if npm view "@docmyrepos/$name@$version" version >/dev/null 2>&1; then
              echo "::error::@docmyrepos/$name@$version is already published; versions are never overwritten."
              exit 1
            fi
          done
      - run: pnpm build:packages
      - name: Publish @docmyrepos/core, server and ui with provenance
        run: pnpm -r publish --provenance --access public --no-git-checks
