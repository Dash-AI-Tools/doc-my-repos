# Keeps the pinned GitHub Actions, npm packages and base images current. Updates arrive as pull
# requests, so CI runs on them like on any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The project targets Postgres 17 (compose, CI and test databases). Move it on purpose.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
