name: Set up Node.js, pnpm and dependencies
description: Installs the pinned Node.js and pnpm versions and the locked dependencies (pnpm install --frozen-lockfile).

# Keep the versions in step with the Dockerfile (NODE_VERSION, PNPM_VERSION). package.json has no
# `packageManager` field, so the pnpm version is given here.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 11.25.0

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
