name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before you file: the MVP deliberately leaves out GitHub OAuth login, per-user access to private repositories, an in-app repository picker, multi-tenancy and editing documents in the UI. Requests for these are welcome as discussion, but they are not planned for the first release.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: help
    attributes:
      label: Would you like to implement it?
      description: Larger changes start with a spec update; see CONTRIBUTING.md.
      options:
        - "Yes"
        - Maybe, with guidance
        - "No"
